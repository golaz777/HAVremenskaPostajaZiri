[tool.pytest.ini_options]
# "." makes custom_components importable for the Home Assistant tests; the
# integration directory lets the HA-free scraper tests import `scraper` directly.
pythonpath = [".", "custom_components/vremenska_postaja_ziri"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
